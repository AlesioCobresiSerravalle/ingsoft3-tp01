name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # La garantía "un equipo no tiene dos préstamos activos" la da un índice de
      # PostgreSQL: sólo se puede probar contra una base real. Postgres efímero,
      # en una red propia del job, con las migraciones aplicadas (las mismas que
      # corren en QA y PROD). `-h 127.0.0.1`: durante el arranque inicial el
      # servidor temporal sólo escucha por socket y pg_isready daría un falso listo.
      - name: Levantar un Postgres descartable para la prueba de concurrencia
        run: |
          docker network create testnet
          docker run -d --name pgtest --network testnet -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pgtest pg_isready -h 127.0.0.1 -U postgres && break
            sleep 2
          done
          docker run --rm --network testnet \
            -e DATABASE_URL="postgresql://postgres:ci@pgtest:5432/ci?schema=public" \
            --entrypoint npx backend:test prisma migrate deploy

      - name: Correr tests con cobertura (el umbral rompe el build)
        run: |
          mkdir -p coverage-backend
          docker run --rm --network testnet \
            -e RUN_DB_TESTS=1 \
            -e DATABASE_URL="postgresql://postgres:ci@pgtest:5432/ci?schema=public" \
            -v "$PWD/coverage-backend:/reports" backend:test

      - name: Resumen de cobertura en el job
        if: ${{ !cancelled() }}
        run: |
          f=coverage-backend/coverage-summary.json
          if [ -f "$f" ]; then
            jq -r '"### Cobertura backend\n\n| Métrica | % |\n|---|---|\n| Líneas | \(.total.lines.pct) |\n| Ramas | \(.total.branches.pct) |\n| Funciones | \(.total.functions.pct) |\n| Sentencias | \(.total.statements.pct) |"' "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó reporte de cobertura del backend (falló antes de medir)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar el reporte de cobertura del backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage-backend/
          if-no-files-found: ignore

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Último paso del job: si algún paso anterior (tests, umbral) falla, el
      # job se corta y este paso nunca corre. El orden es la condición.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/alesiocobresiserravalle/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Correr tests con cobertura (el umbral rompe el build)
        run: |
          mkdir -p coverage-frontend
          docker run --rm -v "$PWD/coverage-frontend:/reports" frontend:test

      - name: Resumen de cobertura en el job
        if: ${{ !cancelled() }}
        run: |
          f=coverage-frontend/coverage-summary.json
          if [ -f "$f" ]; then
            jq -r '"### Cobertura frontend\n\n| Métrica | % |\n|---|---|\n| Líneas | \(.total.lines.pct) |\n| Ramas | \(.total.branches.pct) |\n| Funciones | \(.total.functions.pct) |\n| Sentencias | \(.total.statements.pct) |"' "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó reporte de cobertura del frontend (falló antes de medir)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar el reporte de cobertura del frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage-frontend/
          if-no-files-found: ignore

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Último paso del job: si algún paso anterior (tests, umbral) falla, el
      # job se corta y este paso nunca corre. El orden es la condición.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/alesiocobresiserravalle/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # DEPLOY A QA: migra la base de ESTE entorno, le dice a Render que despliegue el
  # commit de esta corrida y comprueba que el entorno responda.
  # ---------------------------------------------------------------------------
  deploy-qa:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    permissions:
      contents: read
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend (trae el CLI de Prisma)
        working-directory: backend
        run: npm ci

      - name: Migrar la base de QA
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # La base serverless puede estar dormida: la primera conexión tarda.
          # Se reintenta; si sigue fallando, el job se corta ANTES de desplegar.
          for i in 1 2 3; do
            npm run migrate:deploy && exit 0
            echo "Intento $i falló; reintento en 15 s..."; sleep 15
          done
          exit 1

      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_BACKEND }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONTEND }}
        run: |
          # `imgURL` le dice a Render QUÉ IMAGEN ejecutar: la que este mismo
          # pipeline construyó, probó y publicó para este commit. Render ya no
          # construye nada. --get --data-urlencode lo agrega a la URL del hook
          # (que ya trae ?key=...) y le codifica los ':' y '/'. La URL del hook
          # va ÚLTIMA: es el único argumento suelto y --data-urlencode se lleva
          # el valor que tiene al lado. Los secrets no se imprimen.
          IMG_API="ghcr.io/alesiocobresiserravalle/ingsoft3-tp01-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/alesiocobresiserravalle/ingsoft3-tp01-frontend:sha-$GITHUB_SHA"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" > /dev/null
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" > /dev/null
          echo "Imagen sha-$GITHUB_SHA desplegada en api y front de QA"

      - name: Smoke test (espera a que QA responda)
        shell: bash
        env:
          URL_API: https://campusgear-api-qa.onrender.com
          URL_FRONT: https://campusgear-front-qa.onrender.com
        run: |
          # Free tier: arranque en frío + build en Render => hasta ~10 min.
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 15 "$URL_API/api/dashboard/resumen" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT/api/dashboard/resumen" > /dev/null; then
              echo "OK: QA responde (api + base + front + proxy)"; exit 0
            fi
            echo "Intento $i/30: todavía no..."; sleep 20
          done
          echo "QA no respondió a tiempo"; exit 1

  # ---------------------------------------------------------------------------
  # INTEGRACIÓN: pedidos HTTP a la API de QA ya desplegada (con su base de
  # verdad), sin navegador y sin dobles. Si falla, el job queda en rojo y
  # NADA de lo que viene después corre: el gate se lee en `needs`, no en un `if`.
  # ---------------------------------------------------------------------------
  integracion:
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend (trae Playwright)
        working-directory: frontend
        run: npm ci

      # No hace falta bajar ningún navegador: el fixture `request` es un cliente HTTP.
      - name: Pruebas de integración contra la API de QA
        working-directory: frontend
        env:
          API_BASE_URL: https://campusgear-api-qa.onrender.com
          PLAYWRIGHT_HTML_REPORT: reporte-integracion
        run: npx playwright test e2e/api.spec.js --output=resultados-integracion

      - name: Guardar el reporte de integración
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reporte-integracion
          path: frontend/reporte-integracion/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # E2E: un navegador real contra el front de QA (que habla con su API y su
  # base). Es el último escalón antes de producción.
  # ---------------------------------------------------------------------------
  e2e:
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend (trae Playwright)
        working-directory: frontend
        run: npm ci

      - name: Instalar el navegador (Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas extremo a extremo contra QA
        working-directory: frontend
        env:
          E2E_BASE_URL: https://campusgear-front-qa.onrender.com
          API_BASE_URL: https://campusgear-api-qa.onrender.com
          PLAYWRIGHT_HTML_REPORT: reporte-e2e
        run: npx playwright test e2e/equipos.spec.js --output=resultados-e2e

      - name: Guardar el reporte e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reporte-e2e
          path: frontend/reporte-e2e/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # DEPLOY A PRODUCCIÓN: igual que QA, pero `needs: e2e` (sólo se promueve
  # lo que ya pasó por QA, por la integración y por la e2e) y el environment `production` exige la aprobación de
  # un revisor: el job queda en espera hasta que alguien lo aprueba o lo rechaza.
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend (trae el CLI de Prisma)
        working-directory: backend
        run: npm ci

      - name: Migrar la base de PROD
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # La base serverless puede estar dormida: la primera conexión tarda.
          # Se reintenta; si sigue fallando, el job se corta ANTES de desplegar.
          for i in 1 2 3; do
            npm run migrate:deploy && exit 0
            echo "Intento $i falló; reintento en 15 s..."; sleep 15
          done
          exit 1

      - name: Desplegar en PROD la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_BACKEND }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONTEND }}
        run: |
          # `imgURL` le dice a Render QUÉ IMAGEN ejecutar: la que este mismo
          # pipeline construyó, probó y publicó para este commit. Render ya no
          # construye nada. --get --data-urlencode lo agrega a la URL del hook
          # (que ya trae ?key=...) y le codifica los ':' y '/'. La URL del hook
          # va ÚLTIMA: es el único argumento suelto y --data-urlencode se lleva
          # el valor que tiene al lado. Los secrets no se imprimen.
          IMG_API="ghcr.io/alesiocobresiserravalle/ingsoft3-tp01-backend:sha-$GITHUB_SHA"
          IMG_FRONT="ghcr.io/alesiocobresiserravalle/ingsoft3-tp01-frontend:sha-$GITHUB_SHA"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" > /dev/null
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" > /dev/null
          echo "Imagen sha-$GITHUB_SHA desplegada en api y front de PROD"

      - name: Smoke test (espera a que PROD responda)
        shell: bash
        env:
          URL_API: https://campusgear-api-prod.onrender.com
          URL_FRONT: https://campusgear-front-prod.onrender.com
        run: |
          # Free tier: arranque en frío + build en Render => hasta ~10 min.
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 15 "$URL_API/api/dashboard/resumen" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 15 "$URL_FRONT/api/dashboard/resumen" > /dev/null; then
              echo "OK: PROD responde (api + base + front + proxy)"; exit 0
            fi
            echo "Intento $i/30: todavía no..."; sleep 20
          done
          echo "PROD no respondió a tiempo"; exit 1
