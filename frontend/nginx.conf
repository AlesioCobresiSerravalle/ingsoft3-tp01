server {
    listen 80;

    # SPA: estáticos, con fallback a index.html para las rutas del router
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que llegue a /api se reenvía al backend por la red interna de
    # compose. El nombre va en una variable, no escrito directo en el
    # proxy_pass: con el nombre directo, nginx lo resuelve AL ARRANCAR y, si
    # el backend todavía no existe (dos contenedores sueltos, como en esta
    # fase), se niega a levantar. Con variable, resuelve recién cuando llega
    # un pedido.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:3000;

    location /api/ {
        proxy_pass $backend_api;
    }
}
